[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electricity-analyse"
version = "1.0.0"
description = "Analysis of German electricity generation and consumption data: hourly/daily trends, source stability, seasonal decomposition, and forecasting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ahmet Umut Gökdemir" }
]
keywords = ["electricity", "germany", "energy", "time-series", "data-analysis", "forecasting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "ipywidgets>=8.0",
    "statsmodels>=0.14",
    "ipympl>=0.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "jupyter>=1.0",
    "nbformat>=5.9",
]

[project.urls]
Repository = "https://github.com/LittleBigPluton/Germany_electricity_analyse"


[project.scripts]
electricity-analyse = "electricity_analyse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["electricity_analyse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=electricity_analyse --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
